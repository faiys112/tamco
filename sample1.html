<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TAMCO Organization Chart</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }
        
        body {
            background: #f4f4f4;
            padding: 40px 20px;
        }
        /* TITLE */
        
        .title {
            width: fit-content;
            margin: 0 auto 50px;
            padding: 18px 40px;
            border: 3px solid blue;
            border-radius: 18px;
            font-size: 55px;
            font-weight: 300;
            letter-spacing: 2px;
        }
        /* MAIN */
        
        .chart {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        /* BOX */
        
        .box {
            background: #fff;
            border: 3px solid blue;
            border-radius: 14px;
            padding: 16px 30px;
            font-size: 18px;
            font-weight: 600;
            transition: 0.3s;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.08);
        }
        
        .box:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(0, 0, 255, 0.25);
        }
        /* OVAL */
        
        .oval {
            background: #fff;
            border: 3px solid blue;
            border-radius: 50px;
            padding: 14px 28px;
            font-size: 16px;
            font-weight: 600;
            transition: 0.3s;
            text-align: center;
            min-width: 130px;
        }
        
        .oval:hover {
            transform: scale(1.05);
            box-shadow: 0 8px 20px rgba(0, 0, 255, 0.2);
        }
        /* VERTICAL LINE */
        
        .v-line {
            width: 3px;
            height: 40px;
            background: blue;
        }
        /* ARROW */
        
        .arrow-down {
            width: 3px;
            height: 30px;
            background: blue;
            position: relative;
        }
        
        .arrow-down::after {
            content: "";
            position: absolute;
            bottom: -10px;
            left: 50%;
            transform: translateX(-50%);
            border-left: 8px solid transparent;
            border-right: 8px solid transparent;
            border-top: 12px solid blue;
        }
        /* HORIZONTAL MAIN LINE */
        
        .main-horizontal {
            width: 800px;
            height: 3px;
            background: blue;
            margin-top: 40px;
            position: relative;
        }
        /* LEFT & RIGHT CONNECT */
        
        .left-connect,
        .right-connect {
            position: absolute;
            width: 3px;
            height: 25px;
            background: blue;
            top: 0;
        }
        
        .left-connect {
            left: 0;
        }
        
        .right-connect {
            right: 0;
        }
        /* TOP BRANCH */
        
        .branch-row {
            width: 1100px;
            display: flex;
            justify-content: space-between;
            margin-top: 25px;
        }
        /* SIDE SECTION */
        
        .side {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        /* LOWER LINE */
        
        .lower-line {
            width: 200px;
            height: 3px;
            background: blue;
            position: relative;
            margin-top: 15px;
        }
        
        .lower-line::before,
        .lower-line::after {
            content: "";
            position: absolute;
            width: 3px;
            height: 18px;
            background: blue;
            top: 0;
        }
        
        .lower-line::before {
            left: 0;
        }
        
        .lower-line::after {
            right: 0;
        }
        /* OVAL FLEX */
        
        .oval-row {
            display: flex;
            gap: 60px;
            margin-top: 15px;
        }
        /* OFFICE ASSISTANT CONNECT */
        
        .office-connect {
            width: 200px;
            height: 35px;
            border-left: 3px solid blue;
            border-right: 3px solid blue;
            border-bottom: 3px solid blue;
            margin-top: -2px;
            display: flex;
            justify-content: center;
            align-items: flex-end;
        }
        /* RIGHT SECTION */
        
        .right-line {
            width: 720px;
            height: 3px;
            background: blue;
            position: relative;
            margin-top: 15px;
        }
        
        .right-line .drop {
            position: absolute;
            width: 3px;
            height: 20px;
            background: blue;
            top: 0;
        }
        
        .right-line .drop:nth-child(1) {
            left: 0;
        }
        
        .right-line .drop:nth-child(2) {
            left: 150px;
        }
        
        .right-line .drop:nth-child(3) {
            left: 330px;
        }
        
        .right-line .drop:nth-child(4) {
            left: 530px;
        }
        
        .right-line .drop:nth-child(5) {
            right: 0;
        }
        /* RIGHT OVALS */
        
        .right-ovals {
            display: flex;
            gap: 40px;
            margin-top: 15px;
        }
        /* RECOVERY */
        
        .recovery-line {
            width: 620px;
            height: 3px;
            background: blue;
            margin-top: 25px;
            position: relative;
        }
        
        .recovery-line::before,
        .recovery-line::after {
            content: "";
            position: absolute;
            width: 3px;
            height: 35px;
            background: blue;
            top: -35px;
        }
        
        .recovery-line::before {
            left: 0;
        }
        
        .recovery-line::after {
            right: 0;
        }
        /* RECOVERY CENTER */
        
        .recovery-center {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        /* RESPONSIVE */
        
        @media(max-width:1200px) {
            .branch-row {
                width: 100%;
                flex-direction: column;
                gap: 70px;
                align-items: center;
            }
            .main-horizontal {
                width: 90%;
            }
            .right-line {
                width: 100%;
            }
            .right-ovals {
                flex-wrap: wrap;
                justify-content: center;
            }
            .title {
                font-size: 35px;
                text-align: center;
            }
        }
    </style>
</head>

<body>

    <h1 class="title">ORGANIZATION CHART OF TAMCO</h1>

    <div class="chart">

        <div class="box">Chairman</div>

        <div class="arrow-down"></div>

        <div class="box">Managing Director</div>

        <div class="arrow-down"></div>

        <!-- MAIN LINE -->
        <div class="main-horizontal">
            <div class="left-connect"></div>
            <div class="right-connect"></div>
        </div>

        <!-- BRANCHES -->
        <div class="branch-row">

            <!-- LEFT -->
            <div class="side">

                <div class="box">Accounts Officer</div>

                <div class="arrow-down"></div>

                <div class="box">Superintendent</div>

                <div class="arrow-down"></div>

                <div class="lower-line"></div>

                <div class="oval-row">
                    <div class="oval">Assistant</div>
                    <div class="oval">Junior Assistant</div>
                </div>

                <div class="office-connect">
                    <div class="oval">Office Assistant</div>
                </div>

            </div>

            <!-- RIGHT -->
            <div class="side">

                <div class="box">Manager (Credit & Project)</div>

                <div class="arrow-down"></div>

                <div class="box">Superintendent</div>

                <div class="arrow-down"></div>

                <div class="right-line">
                    <div class="drop"></div>
                    <div class="drop"></div>
                    <div class="drop"></div>
                    <div class="drop"></div>
                    <div class="drop"></div>
                </div>

                <div class="right-ovals">

                    <div class="oval">Assistant</div>

                    <div class="oval">Assistant</div>

                    <div class="oval">Junior Assistant</div>

                    <div class="oval">Computer Operator</div>

                    <div class="oval">Typist</div>

                </div>

                <div class="recovery-center">

                    <div class="recovery-line"></div>

                    <div class="oval" style="margin-top:-8px;">
                        Recovery Supervisor
                    </div>

                    <div class="arrow-down"></div>

                    <div class="oval">Office Assistant</div>

                </div>

            </div>

        </div>

    </div>

</body>

</html>
